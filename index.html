<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Room — ambient sensing for mid-level managers</title>
<meta name="description" content="A clickable prototype of Signal: an ambient agent that follows a manager across Zoom, Jira, Slack and Gmail, reconstructs one project from scattered signals, and shows who actually holds authority over the decision.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#0b1117;overflow:hidden}
#fit{position:absolute;top:50%;left:50%;translate:-50% -50%;transform-origin:center center}
#stage{width:1440px;height:900px;position:relative}

body{margin:0;font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;-webkit-font-smoothing:antialiased}
a{color:#215DB0}a:hover{color:#184A90}
button{font-family:inherit;cursor:pointer;border:0;background:none;padding:0;color:inherit}
input,textarea,select{font-family:inherit}
.mono{font-family:'Archivo',-apple-system,sans-serif;text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.card{background:#fff;border:1px solid #E3E3E3;border-radius:3px}
.tag{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 6px;border-radius:2px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-family:'Archivo',sans-serif;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 12px;border-radius:3px;font-size:14px;font-weight:500;white-space:nowrap;border:1px solid #D4D4D4;background:#fff;color:#0E0E0E;transition:background .12s,border-color .12s}
.btn:hover{background:#EFEFEF;border-color:#B0B0B0}
.btn:focus-visible{outline:2px solid #0E0E0E;outline-offset:1px}
.btn--pri{background:#0E0E0E;border-color:#0E0E0E;color:#fff}
.btn--pri:hover{background:#2E2E2E;border-color:#2E2E2E}
.btn--min{height:24px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tabbtn{height:30px;padding:0 12px;font-size:14px;font-weight:500;color:#6B6B6B;border-bottom:2px solid transparent;transition:color .12s}
.tabbtn:hover{color:#0E0E0E;background:#F7F7F7}
.tabbtn.on{color:#0E0E0E;border-bottom-color:#0E0E0E;font-weight:600}
.row{display:flex;align-items:center}
.scroll{overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#D4D4D4 transparent}
.scroll::-webkit-scrollbar{width:9px}
.scroll::-webkit-scrollbar-thumb{background:#D4D4D4;border-radius:5px;border:3px solid #FAFAFA}
.tipwrap{position:relative}
.tip{position:absolute;opacity:0;pointer-events:none;transition:opacity .14s;background:#0E0E0E;color:#F7F7F7;font-size:11px;line-height:1.4;padding:6px 9px;border-radius:3px;white-space:nowrap;box-shadow:0 2px 8px rgba(16,22,26,.3);z-index:60}
.tipwrap:hover .tip{opacity:1}
.chip{background:#fff;border:1px solid #E3E3E3;border-radius:6px;padding:5px 11px;font-size:12.5px;font-weight:500;color:#0E0E0E;box-shadow:0 1px 3px rgba(16,22,26,.13)}
.evrow{display:flex;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:3px;border:1px solid transparent;transition:background .12s,border-color .12s}
.evrow:hover{background:#F7F7F7;border-color:#E3E3E3}
.dockbtn{transition:transform .16s cubic-bezier(.2,.8,.3,1)}
.dockbtn:hover{transform:translateY(-6px) scale(1.06)}
.connrow{display:flex;align-items:center;gap:11px;padding:10px 14px;border-top:1px solid #EFEFEF}
@keyframes fly{0%{top:216px;left:646px;width:34px;height:34px;opacity:1}70%{opacity:1}100%{top:770px;left:1346px;width:58px;height:58px;opacity:1}}
@keyframes dlg-out{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.93)}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes orb-in{from{opacity:0}to{opacity:1}}
@keyframes peek-in{from{opacity:0;transform:scale(.82) translate(34px,42px)}to{opacity:1;transform:none}}
@keyframes room-in{from{opacity:.25;transform:scale(.24)}to{opacity:1;transform:scale(1)}}
@keyframes drawer-in{from{transform:translateX(100%)}to{transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes toast-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
/* ---- Signal kinetic system -------------------------------------------
   The mint disc is a plain unclassed circle: it never animates.
   Everything that moves is a separate element inside the SVG.
   Rotation lives on a wrapping group, compression on the ellipse inside
   it, so the two never fight over the transform property.              */
.sig .orb,.sig .mo,.sig .dot,.sig .core{transform-origin:50px 50px}
.sig .orb,.sig .dot{animation-timing-function:linear;animation-iteration-count:infinite}
.sig .mo,.sig .core{animation-timing-function:ease-in-out;animation-iteration-count:infinite}
.sig .mo{stroke-opacity:.7}
.sig .dot{opacity:0;transition:opacity .8s ease-in-out}
@keyframes rA{from{transform:rotate(-18deg)}to{transform:rotate(342deg)}}
@keyframes rB{from{transform:rotate(64deg)}to{transform:rotate(-296deg)}}
@keyframes rC{from{transform:rotate(148deg)}to{transform:rotate(508deg)}}
@keyframes rD{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes rE{from{transform:rotate(130deg)}to{transform:rotate(-230deg)}}
@keyframes rF{from{transform:rotate(250deg)}to{transform:rotate(610deg)}}
/* structural morphs: vertical -> diagonal -> horizontal, via scale on the ellipse only */
@keyframes mA{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.30)}}
@keyframes mB{0%,100%{transform:scaleY(.42)}50%{transform:scaleY(1.02)}}
@keyframes mC{0%,100%{transform:scaleY(.88)}50%{transform:scaleY(.34)}}
@keyframes mFlat{0%,100%{transform:scaleY(1) scaleX(.9)}50%{transform:scaleY(.20) scaleX(1.08)}}
@keyframes coreBeat{0%,100%{transform:scale(1)}50%{transform:scale(.86)}}
@keyframes coreRest{0%,100%{transform:scaleY(.32) scaleX(1.08)}}
@keyframes restDrift{0%,100%{transform:rotate(-4deg) scaleY(.18)}50%{transform:rotate(4deg) scaleY(.22)}}
/* ON EAR — tuning in: three orbits sweeping through orientations */
.s-onear .oA{animation-name:rA;animation-duration:8.58s}
.s-onear .oB{animation-name:rB;animation-duration:11.7s}
.s-onear .oC{animation-name:rC;animation-duration:14.82s}
.s-onear .mA{animation-name:mA;animation-duration:10.14s}
.s-onear .mB{animation-name:mB;animation-duration:13.26s}
.s-onear .mC{animation-name:mC;animation-duration:11.7s}
.s-onear .dA{animation-name:rD;animation-duration:14.04s}
.s-onear .dB{animation-name:rE;animation-duration:17.16s}
.s-onear .dC{animation-name:rF;animation-duration:20.28s}
.s-onear .dot{opacity:.35}
/* DIGESTING — same system, more active; orbits flatten toward horizontal */
.s-digest .oA{animation-name:rA;animation-duration:6.24s}
.s-digest .oB{animation-name:rB;animation-duration:8.58s}
.s-digest .oC{animation-name:rC;animation-duration:10.92s}
.s-digest .mA{animation-name:mFlat;animation-duration:5.62s}
.s-digest .mB{animation-name:mFlat;animation-duration:6.86s;animation-delay:-1.87s}
.s-digest .mC{animation-name:mFlat;animation-duration:8.11s;animation-delay:-3.74s}
.s-digest .dA{animation-name:rD;animation-duration:9.36s}
.s-digest .dB{animation-name:rE;animation-duration:11.7s}
.s-digest .dC{animation-name:rF;animation-duration:14.04s}
.s-digest .dot{opacity:.6}
.s-digest .core{animation-name:coreBeat;animation-duration:5.62s}
/* ATTENTION — signal found: dots settle in at full weight, tempo eases back */
.s-alert .oA{animation-name:rA;animation-duration:7.8s}
.s-alert .oB{animation-name:rB;animation-duration:10.92s}
.s-alert .oC{animation-name:rC;animation-duration:14.04s}
.s-alert .mA{animation-name:mA;animation-duration:10.92s}
.s-alert .mB{animation-name:mB;animation-duration:14.04s}
.s-alert .mC{animation-name:mC;animation-duration:12.48s}
.s-alert .dA{animation-name:rD;animation-duration:12.48s}
.s-alert .dB{animation-name:rE;animation-duration:15.6s}
.s-alert .dC{animation-name:rF;animation-duration:18.72s}
.s-alert .dot{opacity:.7}
/* REST — one calm horizontal ellipse, core flattened, dots gone */
.s-rest .oA{animation-name:rD;animation-duration:40.56s}
.s-rest .mA{animation-name:restDrift;animation-duration:14.04s}
.s-rest .oB,.s-rest .oC{opacity:0}
.s-rest .dot{opacity:0}
.s-rest .core{animation-name:coreRest;animation-duration:14.04s}
@media (prefers-reduced-motion:reduce){.sig .orb,.sig .mo,.sig .dot,.sig .core{animation:none}}

</style>
</head>
<body>
<div id="fit"><div id="stage"></div></div>
<template id="tpl">

<div style="width:1440px;height:900px;position:relative;overflow:hidden;background:#0d1117;color:#0E0E0E;font-size:13px">

  <!-- ============ DESKTOP WALLPAPER ============ -->
  <button onClick="{{ deskClick }}" aria-label="Restart the prototype from the setup screen" style="position:absolute;inset:0;width:1440px;height:900px;padding:0;border:0;display:block;cursor:pointer">
    <img src="wallpaper.webp" alt="" style="width:1440px;height:900px;object-fit:cover;display:block">
  </button>

  <!-- ============ MENU BAR ============ -->
  <div style="position:absolute;left:0;top:0;width:1440px;height:30px;display:flex;align-items:center;padding:0 16px;gap:22px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:#000;z-index:15">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="flex-shrink:0"><path d="M17.05 12.54c-.02-2.3 1.88-3.4 1.96-3.45-1.07-1.56-2.73-1.78-3.32-1.8-1.41-.14-2.76.83-3.48.83-.72 0-1.83-.81-3.01-.79-1.55.02-2.98.9-3.78 2.29-1.61 2.8-.41 6.94 1.15 9.21.77 1.11 1.68 2.36 2.87 2.31 1.15-.05 1.59-.74 2.98-.74s1.78.74 3 .72c1.24-.02 2.02-1.13 2.78-2.25.88-1.29 1.24-2.54 1.26-2.6-.03-.01-2.41-.93-2.43-3.69M14.9 5.36c.64-.77 1.07-1.85.95-2.92-.92.04-2.03.61-2.69 1.38-.59.68-1.11 1.77-.97 2.82 1.03.08 2.07-.52 2.71-1.28"/></svg>
    <span style="font-weight:600">Finder</span>
    <span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span><span>Help</span>
    <span style="flex-grow:1"></span>
    <div class="tipwrap" style="display:flex;align-items:center">
      <button onClick="{{ reset }}" aria-label="Restart the prototype from setup" style="display:flex;align-items:center;color:#000">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 11-2.8-6.3"/><path d="M20.5 3.6v4.8h-4.8"/></svg>
      </button>
      <span class="tip" style="top:26px;right:0">Restart demo</span>
    </div>
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M2.6 8.7a14.6 14.6 0 0118.8 0"/><path d="M6 12.4a9.5 9.5 0 0112 0"/><path d="M9.3 16a4.8 4.8 0 015.4 0"/><circle cx="12" cy="19.2" r="1.2" fill="#000" stroke="none"/></svg>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.6"/><path d="M15.5 15.5L21 21"/></svg>
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9.3"/><circle cx="12" cy="9.7" r="3.1"/><path d="M5.7 19.5a7.1 7.1 0 0112.6 0"/></svg>
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4.3" width="18" height="6.5" rx="3.25"/><circle cx="16.5" cy="7.55" r="1.7" fill="#000" stroke="none"/><rect x="3" y="13.2" width="18" height="6.5" rx="3.25"/><circle cx="7.5" cy="16.45" r="1.7" fill="#000" stroke="none"/></svg>
    <span style="font-size:14px;margin-left:2px">Mon Jun 10&nbsp;&nbsp;9:41 AM</span>
  </div>

  <!-- ============ SETUP SCREEN ============ -->
  <sc-if value="{{ isSetup }}" hint-placeholder-val="{{ true }}">
  <div style="{{ setupStyle }}">
    <div style="width:660px;background:#fff;border-radius:14px;box-shadow:0 26px 70px rgba(10,22,44,.34),0 2px 8px rgba(10,22,44,.18);overflow:hidden">

      <div style="display:flex;align-items:center;justify-content:center;gap:12px;padding:30px 0 4px">
        <div style="width:34px;height:34px;filter:drop-shadow(0 2px 5px rgba(16,40,30,.24))">
          <svg viewBox="9 43 180 180" style="width:100%;height:100%;display:block" aria-hidden="true"><circle cx="99" cy="133" r="90" fill="#A5F2CC"/><g style="transform-origin:99px 133px"><path d="M91.0437 160.737C124.757 170.404 155.649 165.818 160.044 150.494C164.438 135.17 140.67 114.91 106.956 105.243C73.2429 95.5756 42.3505 100.162 37.9564 115.486C33.5622 130.81 57.3302 151.07 91.0437 160.737Z" stroke="#111111" stroke-width="6.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M123.451 148.868C141.423 121.193 145.046 91.6478 131.543 82.8784C118.039 74.109 92.5223 89.4357 74.5494 117.112C56.5765 144.787 52.9535 174.332 66.4572 183.102C79.9608 191.871 105.478 176.544 123.451 148.868Z" stroke="#111111" stroke-width="6.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M99.0001 148C107.29 148 114.01 141.279 114.01 132.99C114.01 124.7 107.29 117.98 99.0001 117.98C90.7103 117.98 83.9901 124.7 83.9901 132.99C83.9901 141.279 90.7103 148 99.0001 148Z" fill="#fff"/></svg>
        </div>
        <span style="font-size:23px;font-weight:700;letter-spacing:-.02em">Welcome to Signal</span>
      </div>

      <div style="padding:26px 88px 30px">
        <h1 style="margin:0 0 5px;font-size:19px;font-weight:600;letter-spacing:-.02em">Connect your work tools</h1>
        <p style="margin:0 0 4px;font-size:13px;line-height:1.5;color:#6B6B6B;max-width:400px">Select the tools you use. Signal only accesses information you explicitly authorize.</p>

        <div style="margin-top:18px;border:1px solid #E3E3E3;border-radius:6px;overflow:hidden">
          <sc-for list="{{ tools }}" as="t" hint-placeholder-count="6">
            <div style="{{ t.rowStyle }}">
              <span style="flex-shrink:0;display:block;width:30px;height:30px"><dc-import name="Logo" app="{{ t.app }}" size="30" hint-size="30px,30px"></dc-import></span>
              <div style="flex-grow:1;min-width:0">
                <div style="font-size:13px;font-weight:600;line-height:1.3">{{ t.name }}</div>
                <div style="font-size:11.5px;color:#6B6B6B;line-height:1.35">{{ t.desc }}</div>
              </div>
              <sc-if value="{{ t.connected }}" hint-placeholder-val="{{ true }}">
                <span class="tag" style="background:#E7F4EC;color:#1C6E42;border:1px solid #C6E6D4;height:22px;padding:0 8px">
                  <svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.4l2.6 2.6L10 3.4" fill="none" stroke="#1C6E42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Connected
                </span>
              </sc-if>
              <sc-if value="{{ t.notConnected }}" hint-placeholder-val="{{ true }}">
                <button class="btn btn--min" onClick="{{ t.go }}" style="border-color:#8ABBFF;color:#215DB0;background:#fff;height:26px;padding:0 13px">Connect</button>
              </sc-if>
            </div>
          </sc-for>
        </div>

        <div style="display:flex;align-items:center;gap:10px;margin-top:16px">
          <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true" style="flex-shrink:0"><path d="M8 1.5l5 2v4c0 3.1-2 5.5-5 7-3-1.5-5-3.9-5-7v-4z" fill="none" stroke="#6B6B6B" stroke-width="1.3" stroke-linejoin="round"/></svg>
          <span style="font-size:11.5px;color:#6B6B6B;line-height:1.45;flex-grow:1">Signal never expands your access. It reads only what your account is already permitted to see. Capabilities: <b style="color:#6B6B6B">Observe + Suggest</b>.</span>
        </div>

        <div style="display:flex;align-items:center;gap:14px;margin-top:22px;justify-content:flex-end">
          <span style="font-size:11.5px;color:{{ hintColor }}">{{ continueHint }}</span>
          <button class="btn btn--pri" onClick="{{ cont }}" disabled="{{ notReady }}" style="height:34px;padding:0 22px;font-size:13.5px;font-weight:600;border-radius:4px">Continue&nbsp; &rarr;</button>
        </div>
      </div>
    </div>
  </div>
  </sc-if>

  <!-- flying orb between setup and desktop -->
  <sc-if value="{{ flying }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;animation:fly 1s cubic-bezier(.55,.05,.3,1) forwards;z-index:70;filter:drop-shadow(0 6px 16px rgba(10,30,20,.34))">
      <svg viewBox="9 43 180 180" style="width:100%;height:100%;display:block" aria-hidden="true"><circle cx="99" cy="133" r="90" fill="#A5F2CC"/><g style="transform-origin:99px 133px"><path d="M91.0437 160.737C124.757 170.404 155.649 165.818 160.044 150.494C164.438 135.17 140.67 114.91 106.956 105.243C73.2429 95.5756 42.3505 100.162 37.9564 115.486C33.5622 130.81 57.3302 151.07 91.0437 160.737Z" stroke="#111111" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M123.451 148.868C141.423 121.193 145.046 91.6478 131.543 82.8784C118.039 74.109 92.5223 89.4357 74.5494 117.112C56.5765 144.787 52.9535 174.332 66.4572 183.102C79.9608 191.871 105.478 176.544 123.451 148.868Z" stroke="#111111" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M99.0001 148C107.29 148 114.01 141.279 114.01 132.99C114.01 124.7 107.29 117.98 99.0001 117.98C90.7103 117.98 83.9901 124.7 83.9901 132.99C83.9901 141.279 90.7103 148 99.0001 148Z" fill="#fff"/></svg>
    </div>
  </sc-if>

  <!-- ============ DESKTOP + WORK APPS ============ -->
  <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
  <div style="position:absolute;inset:0;animation:fade-in .35s ease">

    <div style="{{ winStyle }}">
      <!-- window chrome -->
      <div style="height:34px;background:#F7F7F7;border-bottom:1px solid #E3E3E3;display:flex;align-items:center;padding:0 13px;flex-shrink:0">
        <span style="width:11px;height:11px;border-radius:50%;background:#FF5F57;display:block"></span>
        <span style="width:11px;height:11px;border-radius:50%;background:#FEBC2E;display:block;margin-left:7px"></span>
        <span style="width:11px;height:11px;border-radius:50%;background:#28C840;display:block;margin-left:7px"></span>
        <span style="flex-grow:1;text-align:center;font-size:12.5px;font-weight:600;color:#3D3D3D;margin-left:-60px">{{ winTitle }}</span>
      </div>

      <!-- ZOOM -->
      <sc-if value="{{ isZoom }}" hint-placeholder-val="{{ true }}">
      <div style="flex-grow:1;display:flex;flex-direction:column;background:#fff;min-height:0">
        <div style="display:flex;align-items:center;gap:9px;padding:9px 14px;border-bottom:1px solid #EFEFEF">
          <span class="tag" style="background:#FDEDE4;color:#9E3B1F;border:1px solid #F5CDBB">&#9679; Recording</span>
          <span style="font-size:12px;font-weight:600">Vendor Technical Review &mdash; NAS</span>
          <span style="font-size:11.5px;color:#6B6B6B">Jun 07 &middot; 41 min &middot; 6 participants</span>
        </div>
        <div style="flex-grow:1;padding:14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:10px;min-height:0">
          <sc-for list="{{ zoomTiles }}" as="p" hint-placeholder-count="8">
            <div style="{{ p.tileStyle }}">
              <div style="{{ p.avStyle }}">{{ p.initials }}</div>
              <div style="position:absolute;left:8px;bottom:7px;display:flex;align-items:center;gap:5px;background:rgba(15,20,25,.62);border-radius:3px;padding:2px 7px">
                <span style="font-size:11px;color:#fff;font-weight:500">{{ p.name }}</span>
              </div>
              <span style="{{ p.roleStyle }}">{{ p.role }}</span>
            </div>
          </sc-for>
        </div>
        <div style="border-top:1px solid #EFEFEF;background:#F7F7F7;padding:9px 14px">
          <div class="mono" style="font-size:10px;letter-spacing:.07em;color:#8A8A8A;margin-bottom:4px">LIVE TRANSCRIPT</div>
          <div style="font-size:12.5px;line-height:1.55;color:#0E0E0E"><b>Dana Okafor</b> &mdash; &ldquo;Vendor A clears our throughput and IOPS targets. The open item is encryption&#8209;at&#8209;rest configuration &mdash; that needs a separate security pass.&rdquo;</div>
        </div>
        <div style="height:56px;border-top:1px solid #E3E3E3;display:flex;align-items:center;justify-content:center;gap:34px;background:#fff;flex-shrink:0;font-size:11px;color:#6B6B6B">

    v.notDecided = !s.decision; v.decided = !!s.decision;
    v.recReason = s.replied
      ? 'Security is a required final authority. Sarah Chen has now answered directly and is withholding approval until Vendor A confirms its encryption-at-rest configuration.'
      : 'Security is a required final authority and has not approved the current configuration. The only signal covering that dimension is 2 hops old.';
    v.rests = [
      { dim:'Business priority', who:'Marcus Vance · CEO', vd:'Cleared', k:'direct' },
      { dim:'Budget', who:'Priya Raman · Finance', vd:'Cleared', k:'direct' },
      { dim:'Technical fit', who:'Dana Okafor · Infrastructure', vd:'Cleared', k:'direct' },
      { dim:'Security approval', who:'Sarah Chen · Security Lead — final authority',
        vd: s.replied ? 'Blocked · vendor encryption' : 'Unverified · 2 hops', k:'danger', hot:1 },
      { dim:'Procurement', who:'Tom Reyes · Procurement Lead', vd:'Waiting on security', k:'neutral' }
    ].map(function (r, i) {
      return { dim:r.dim, who:r.who, verdict:r.vd,
        tagStyle: self.T(r.k) + (r.hot ? ';font-weight:700' : ''),
        rowStyle: 'display:flex;align-items:center;gap:10px;padding:10px;border-radius:3px;'
          + (i ? 'margin-top:5px;' : '') + (r.hot ? 'background:#FDF9F2;box-shadow:inset 3px 0 0 #C87619' : '') };
    });

    var actDefs = [
      { k:'forward',  l:'Move Forward', sub:'Approve and start deployment' },
      { k:'pending',  l:'Keep Pending', sub:'Hold until security clears', rec:1 },
      { k:'escalate', l:'Escalate',     sub:'Raise to steering group' },
      { k:'cancel',   l:'Cancel',       sub:'Do not proceed this quarter' }
    ];
    v.actions = actDefs.map(function (a) {
      return { label:a.l, sub:a.sub,
        style:'display:flex;flex-direction:column;align-items:center;gap:5px;padding:15px 10px;border-radius:3px;text-align:center;transition:border-color .12s,background .12s;'
          + (a.rec ? 'border:1.5px solid #C87619;background:#FDF9F2' : 'border:1px solid #D4D4D4;background:#fff'),
        go: function () { self.setState({ decision:a.k }); } };
    });
    var fin = {
      forward:  { w:'APPROVED',  st:'background:#E7F4EC;color:#1C6E42;border:1px solid #C6E6D4', r:'Moving forward on leadership priority and the vendor deadline. Security confirmation tracked as a deployment gate.' },
      pending:  { w:'PENDING',   st:'background:#FDF0DF;color:#935610;border:1px solid #F3D9B4', r: s.replied ? 'Awaiting Vendor A encryption confirmation.' : 'Awaiting direct security confirmation.' },
      escalate: { w:'ESCALATED', st:'background:#EFEAFB;color:#5642A6;border:1px solid #D4C9F0', r:'Raised to the infrastructure steering group — the security timeline conflicts with the vendor pricing deadline.' },
      cancel:   { w:'CANCELLED', st:'background:#FDF0F0;color:#AC2F33;border:1px solid #F2C7C8', r:'Vendor A will not be pursued this quarter.' }
    };
    var f = fin[s.decision] || fin.pending;
    v.finalWord = f.w;
    v.finalReason = f.r;
    v.finalBadgeStyle = 'display:inline-block;margin-top:5px;padding:5px 10px;border-radius:3px;font-size:14px;font-weight:700;letter-spacing:.06em;font-family:\'Archivo\',sans-serif;' + f.st;
    v.undo = function () { self.setState({ decision:null }); };

    return v;
  }
}

window.SIGNAL_START(Component);
window.SIGNAL_FIT();
</script>
